[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vidlabel-spec"
version = "0.4.0"
description = "Specification (pydantic models + JSON Schema) for the vidlabel video annotation format"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/vidlabel_spec"]
