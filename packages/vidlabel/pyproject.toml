[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vidlabel"
version = "0.6.1"
description = "Open, directory-based format and Python library for video annotations: time markers, boxes, masks, tracks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["video", "annotation", "labelling", "bounding boxes", "masks", "dataset", "computer vision"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "vidlabel-spec==0.6.1",
    "numpy>=1.24",
    "pyarrow>=14",
    "zstandard>=0.22",
    "typer>=0.12",
]

[project.optional-dependencies]
video = ["opencv-python-headless>=4.8"]
ui = ["starlette>=0.37", "uvicorn>=0.29", "opencv-python-headless>=4.8"]
mcp = ["mcp>=1.23", "opencv-python-headless>=4.8"]
torch = ["opencv-python-headless>=4.8", "torch>=2.0"]

[project.scripts]
vidlabel = "vidlabel.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vidlabel"]

[project.urls]
Homepage = "https://github.com/HIManish-G/pyvidlabel"
Documentation = "https://github.com/HIManish-G/pyvidlabel/wiki"
Issues = "https://github.com/HIManish-G/pyvidlabel/issues"
Changelog = "https://github.com/HIManish-G/pyvidlabel/blob/main/docs/changelog.md"
