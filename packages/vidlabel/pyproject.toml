[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vidlabel"
version = "0.6.0"
description = "Open, directory-based format and Python library for video annotations: time markers, boxes, masks, tracks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "vidlabel-spec==0.6.0",
    "numpy>=1.24",
    "pyarrow>=14",
    "zstandard>=0.22",
    "typer>=0.12",
]

[project.optional-dependencies]
video = ["opencv-python-headless>=4.8"]
ui = ["starlette>=0.37", "uvicorn>=0.29", "opencv-python-headless>=4.8"]
mcp = ["mcp>=1.23", "opencv-python-headless>=4.8"]
torch = ["opencv-python-headless>=4.8", "torch>=2.0"]

[project.scripts]
vidlabel = "vidlabel.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vidlabel"]
